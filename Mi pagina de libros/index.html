<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Mente Tranquila - Libro 3D Interactivo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Título arriba -->
    <div class="title-container">
        <h1 class="book-title">Mente Tranquila</h1>
        <p class="subtitle">Encuentra la paz interior en cada página</p>
    </div>

    <!-- Imagen del libro en el medio -->
    <div class="container">
        <div class="book-wrapper">
            <div class="book-3d">
                <img src="leon web(2).webp" alt="Libro" class="book-image" id="libro">
                <div class="book-glow"></div>
            </div>
        </div>
    </div>

    <!-- Precio -->
    <div class="price-container">
        <span class="price-tag">$5.99</span>
    </div>

    <!-- Texto llamativo -->
    <div class="info-text">
        <p class="catchy-phrase">✨ Transforma tu vida · Encuentra la calma · Vive mejor ✨</p>
        <p class="small-text">📖 Más de 10,000 lectores ya lo disfrutan</p>
    </div>

    <!-- Botones de contacto -->
    <div class="contact-buttons">
        <a href="https://wa.me/593963117997?text=Hola,%20quiero%20comprar%20el%20libro%20Mente%20Tranquila" 
           target="_blank" 
           class="btn-whatsapp">
            <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png" alt="WhatsApp">
            <span>WhatsApp</span>
        </a>
        
        <a href="https://t.me/+4xjFe_l-bzViYmE5" 
           target="_blank" 
           class="btn-telegram">
            <img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png" alt="Telegram">
            <span>Telegram</span>
        </a>
    </div>

    <script src="script.js"></script>
</body>
</html>
